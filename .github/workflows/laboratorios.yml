name: Laboratórios

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Testar caso evolutivo
        run: python -m unittest discover -s examples/evolving-case/tests -v
      - name: Validar dataset de ajuste
        run: python examples/fine-tuning-lab/validate_dataset.py
      - name: Executar simulação de serving
        run: python examples/serving-lab/simulate.py --requests 20
